- clean:
  - '~'
  - '~/bin'
  - '~/.config/fish'


- defaults:
    link:
      create: true
      relink: true
      force: false

- link:
    ~/.profile:
    ~/.bash_profile:
    ~/.bashrc:
    ~/.gitconfig:
    ~/.ssh/config:
      path: ssh/config
    ~/.emacs.d/early-init.el:
      path: emacs.d/early-init.el
    ~/.emacs.d/init.el:
      path: emacs.d/init.el
    ~/.vimrc:
    ~/bin:
    ~/.config/bat:
    ~/.config/doom:
    ~/.config/git/ignore:
      path: config/git/ignore
    ~/.config/fish:
      path: config/fish
    ~/.config/agents/AGENTS.md:
      path: config/agents/AGENTS.md
    ~/.pi/agent/extensions/auto-read-agents-refs.ts:
      path: pi/extensions/auto-read-agents-refs.ts
    ~/.pi/agent/extensions/background-jobs.ts:
      path: pi/extensions/background-jobs.ts
    ~/.editorconfig:
    ~/.inputrc:
    ~/.spacemacs:
    ~/.tmux.conf:

- shell:
  - [git submodule update --init --recursive, Installing submodules]
